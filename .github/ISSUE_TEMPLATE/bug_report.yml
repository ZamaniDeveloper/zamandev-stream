name: Bug report
description: Report a reproducible WebRTC or interface problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browsers, operating systems, device types, and network type.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Room mode
      options:
        - One-to-one call
        - Group conference
        - Live streaming
        - Not applicable
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Include sanitized console errors, WebRTC stats, screenshots, or recordings.